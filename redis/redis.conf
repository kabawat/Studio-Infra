# Access: only the private Docker bridge; credentials are generated separately.
bind 0.0.0.0
protected-mode yes
port 6379
dir /data
aclfile /run/secrets/redis_acl
acl-pubsub-default resetchannels

# Capacity: never evict queue, authentication or idempotency records.
maxclients 2000
maxmemory-policy noeviction
tcp-keepalive 60
timeout 0

# Durability: fsync acknowledged writes and retain periodic snapshots.
appendonly yes
appendfsync always
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated no
save 900 1
save 300 100
save 60 10000
stop-writes-on-bgsave-error yes
rdbchecksum yes
rdbcompression yes

# Diagnostics: bounded slow-command history and latency sampling.
loglevel notice
latency-monitor-threshold 20
slowlog-log-slower-than 10000
slowlog-max-len 128
